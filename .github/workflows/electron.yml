name: Build Electron Releases

on:
  push:
    branches: ["master"]

permissions:
  contents: write

jobs:
  build-electron:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            chrome: /usr/bin/google-chrome
          - os: windows-2025
            platform: win
            chrome: C:\Program Files\Google\Chrome\Application\chrome.exe
          - os: macos-15
            platform: mac
            chrome: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          # see pages.yml
          external-cache: |
            manifest:
              npm:
                - bun.lock
                - package.json
                - .npmrc
                - .bun-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          cache: true

      - name: Install dependencies
        run: bun i --frozen-lockfile

      # bun_install skips puppeteer's browser download (--ignore-scripts);
      # the cache step uses the Chrome preinstalled on the runner instead.
      - name: Build Distribution for ${{ matrix.platform }}
        run: bun run desktop:dist:${{ matrix.platform }}
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ matrix.chrome }}

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rolling Release
          prerelease: true
          overwrite: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.snap
            release/*.deb
          body: "This release contains offline Electron builds of convert.to.it, built from the latest commit on the `master` branch."
